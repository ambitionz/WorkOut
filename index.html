<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-body-tertiary">
  <div class="app-shell container py-4 py-lg-5">
    <header class="app-header card border-0 shadow-sm overflow-hidden">
      <div class="card-body d-flex flex-column flex-xl-row justify-content-between align-items-xl-end gap-4 p-4 p-lg-5">
        <div>
          <div class="dashboard-kicker text-uppercase fw-semibold mb-2 d-inline-flex align-items-center gap-2">
            <i class="bi bi-lightning-charge-fill"></i>
            <span>Strength dashboard</span>
          </div>
          <h1 class="h2 mb-2 d-flex align-items-center gap-3">
            <span class="brand-icon d-inline-flex align-items-center justify-content-center rounded-circle">
              <i class="bi bi-activity"></i>
            </span>
            <span>Workout Tracker</span>
          </h1>
          <p class="hero-copy text-secondary mb-0">Track sets, training volume, PRs, and weekly progress in one clean view.</p>
        </div>

        <div class="header-controls d-flex flex-column flex-md-row align-items-stretch align-items-md-end gap-3">
          <label class="date-field">
            <span class="date-label">Workout Date</span>
            <div class="input-group input-group-lg">
              <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
              <input id="workout-date" class="form-control" type="date" />
            </div>
          </label>
          <button id="autofill-btn" class="btn btn-outline-primary d-inline-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-magic"></i>
            <span>Autofill Last Workout</span>
          </button>
          <button id="copy-btn" class="btn btn-outline-light border-secondary-subtle text-body d-inline-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-arrow-repeat"></i>
            <span>Load Previous Workout</span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="summary-card row g-3">
        <div class="col-12 col-md-6 col-xl-4">
          <div class="summary-item card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="summary-icon text-primary bg-primary-subtle">
                <i class="bi bi-bar-chart-line-fill"></i>
              </div>
              <div>
                <span>Daily Volume</span>
                <strong id="daily-volume">0 kg</strong>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
          <div class="summary-item card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="summary-icon text-success bg-success-subtle">
                <i class="bi bi-trophy-fill"></i>
              </div>
              <div>
                <span>Best Workout (PR)</span>
                <strong id="pr-volume">0 kg</strong>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-xl-4">
          <div class="summary-item card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="summary-icon text-warning bg-warning-subtle">
                <i class="bi bi-graph-up-arrow"></i>
              </div>
              <div>
                <span>Next Week Comparison</span>
                <strong id="week-comparison">No previous week data</strong>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="exercise-grid" class="exercise-grid row g-4"></section>

      <section class="actions">
        <button id="save-btn" class="btn btn-primary btn-lg d-inline-flex align-items-center gap-2">
          <i class="bi bi-floppy2-fill"></i>
          <span>Save Workout</span>
        </button>
        <button id="export-btn" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2">
          <i class="bi bi-download"></i>
          <span>Export JSON</span>
        </button>
        <label for="import-input" class="btn btn-outline-secondary fake-button d-inline-flex align-items-center gap-2">
          <i class="bi bi-upload"></i>
          <span>Import JSON</span>
        </label>
        <input id="import-input" type="file" accept="application/json" />
      </section>

      <section class="chart-card card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
            <div>
              <h2 class="h5 mb-1 d-flex align-items-center gap-2">
                <i class="bi bi-graph-up-arrow text-primary"></i>
                <span>Weekly Volume Progress</span>
              </h2>
              <p class="text-secondary small mb-0">A quick trend view of weekly training load.</p>
            </div>
          </div>
          <div class="chart-wrapper">
            <canvas id="weekly-chart" aria-label="Weekly volume chart" role="img"></canvas>
          </div>
        </div>
      </section>
    </main>
  </div>

  <template id="exercise-card-template">
    <article class="exercise-card col-12 col-md-6 col-xl-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body p-4">
          <div class="exercise-head">
            <div class="d-flex align-items-center gap-2 flex-grow-1">
              <span class="exercise-icon text-primary bg-primary-subtle">
                <i class="bi bi-dumbbell"></i>
              </span>
              <input class="exercise-name form-control form-control-lg" type="text" maxlength="60" />
            </div>
            <div class="exercise-volume badge rounded-pill text-bg-light" data-exercise-volume>0 kg</div>
          </div>
          <div class="table-wrapper">
            <table class="table table-sm align-middle mb-0">
              <thead>
                <tr>
                  <th>Set #</th>
                  <th>Weight (kg)</th>
                  <th>Reps</th>
                  <th>Fails</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </article>
  </template>

  <template id="set-row-template">
    <tr>
      <td class="set-number"></td>
      <td><input class="weight-input form-control form-control-sm text-center" type="number" min="0" step="0.5" inputmode="decimal" /></td>
      <td>
        <div class="rep-cell">
          <button class="rep-btn rep-minus btn btn-outline-primary btn-sm" type="button" aria-label="Decrease reps">
            <i class="bi bi-dash-lg"></i>
          </button>
          <input class="reps-input form-control form-control-sm text-center" type="number" min="0" step="1" inputmode="numeric" />
          <button class="rep-btn rep-plus btn btn-outline-primary btn-sm" type="button" aria-label="Increase reps">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>
      </td>
      <td><input class="fail-input form-control form-control-sm text-center" type="number" min="0" step="1" inputmode="numeric" placeholder="0" /></td>
    </tr>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
